name: Compiler l'APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: SDK Android
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties && ls $ANDROID_HOME
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compilation
        run: gradle assembleRelease --stacktrace --no-daemon
      - name: Renommer l'APK
        run: cp app/build/outputs/apk/release/app-release.apk OmniIPTV.apk
      - uses: actions/upload-artifact@v4
        with:
          name: OmniIPTV-apk
          path: OmniIPTV.apk
      - name: Publier en release (lien de téléchargement direct)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Omni IPTV 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: OmniIPTV.apk
